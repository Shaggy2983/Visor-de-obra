# Compila la aplicación Android (Trusted Web Activity) en GitHub, que ya
# trae el SDK de Android instalado. Salen dos archivos, descargables desde
# la ejecución del flujo (sección «Artifacts»):
#
#   coordinate-obra-<versión>.aab   para subir a Google Play
#   coordinate-obra-<versión>.apk   para instalar a mano en un teléfono
#
# Firma: si el repositorio tiene los secretos ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD, los
# dos salen firmados con esa clave de subida. Sin ellos se compilan igual,
# pero sin firmar: sirven para comprobar que todo compila, no para Play.
# Cómo crear la clave y los secretos: apk/LEEME-APK.md.

name: Compilar app Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Número de versión interno (déjalo vacío para usar el de la ejecución)'
        required: false

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Recuperar la clave de firma
        env:
          CLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLAVE" ]; then
            echo "$CLAVE" | base64 -d > "$RUNNER_TEMP/subida.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/subida.jks" >> "$GITHUB_ENV"
            echo "Se firmará con la clave de subida."
          else
            echo "::warning::No hay clave de firma en los secretos: se compila sin firmar (no vale para Play)."
          fi

      - name: Compilar
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Reunir los archivos
        id: archivos
        run: |
          version=$(grep '^versionName=' gradle.properties | cut -d= -f2)
          codigo=${VERSION_CODE:-$GITHUB_RUN_NUMBER}
          firma=$([ -n "$ANDROID_KEYSTORE_PATH" ] && echo firmado || echo sin-firmar)
          nombre="coordinate-obra-${version}-${codigo}-${firma}"
          mkdir -p "$RUNNER_TEMP/salida"
          cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/salida/${nombre}.aab"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/salida/${nombre}.apk"
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
          ls -la "$RUNNER_TEMP/salida"
        env:
          VERSION_CODE: ${{ inputs.version_code }}

      # La huella SHA-256 de la clave de subida, para assetlinks.json.
      - name: Huella de la clave
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E 'SHA256:' | sed 's/^/Huella de la clave de subida -> /'

      - name: Publicar los archivos de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archivos.outputs.nombre }}
          path: ${{ runner.temp }}/salida/
          retention-days: 30
