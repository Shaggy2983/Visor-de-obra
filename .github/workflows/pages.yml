# Publica la app en GitHub Pages en cada empujón a main.
#
# Pages sirve la rama gh-pages (Settings → Pages → «Deploy from a
# branch»). Este flujo no construye nada: la raíz del repositorio ya es la
# app, así que basta con dejar gh-pages igual que main. GitHub publica solo
# cada vez que cambia esa rama («pages build and deployment»).

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Una publicación cada vez; si llega otra, la última manda.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar main a gh-pages
        # gh-pages es sólo un espejo de main: se sobrescribe sin más.
        run: git push --force origin HEAD:refs/heads/gh-pages
