# Dónde vive la app web que abre la aplicación Android. Si se cambia de
# dirección (un dominio propio, por ejemplo), basta con tocar estas dos
# líneas y volver a compilar.
twaHost=shaggy2983.github.io
twaRuta=/Visor-de-obra/

# Versión visible en Play. El número interno (versionCode) lo pone la
# compilación: en GitHub Actions es el número de ejecución.
versionName=1.0.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
